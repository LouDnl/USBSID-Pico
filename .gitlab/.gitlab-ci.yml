# USBSID-Pico GitLab CI/CD configuration
#
# Mirrors the GitHub Actions workflows in .github/workflows/:
#   build.yml        -> firmware:*                 dev branch firmware builds
#   buildtools.yml   -> tools:*                    dev branch tools builds
#   release.yml      -> release:*, package:*, create:release
#                                                  v* tags, versioned release
#   tagged_build.yml -> release:*, package:*, create:snapshot,
#                       cleanup:old-snapshots      d* tags, snapshot prerelease
#
# Supports two GitLab instances:
#   - gitlab.loudai.nl (private): Linux and Windows runners
#   - gitlab.com (public): Linux, macOS and Windows runners
#
# NOTE: this file lives in .gitlab/, so the project setting
# Settings > CI/CD > General pipelines > CI/CD configuration file must be
# set to ".gitlab/.gitlab-ci.yml" on both instances.

variables:
  BUILD_THREADS: "4"
  BUILD_TYPE: "Release"
  # Pico-SDK versions, keep in sync with the GitHub workflows
  PICO_SDK_REF: "2.2.0"
  PICO_EXTRAS_REF: "sdk-2.2.0"
  PICOTOOL_REF: "2.2.0"
  # Sources for the extra checkouts. Override these in the CI/CD variables to
  # build against the GitLab mirrors instead of GitHub.
  USBSID_PLAYER_REPO: "https://github.com/loudnl/usbsid-player.git"
  BIN2H_REPO: "https://github.com/elnormous/bin2h.git"
  # Instance without a macOS runner
  PRIVATE_HOST: "gitlab.loudai.nl"
  # Windows runner tag. The default is the gitlab.com SaaS runner, set this
  # in the project CI/CD variables on an instance with its own Windows runner.
  WINDOWS_RUNNER_TAG: "saas-windows-medium-amd64"
  GIT_SUBMODULE_STRATEGY: recursive
  DEBIAN_FRONTEND: noninteractive

# Pipeline runs on:
# - dev branch pushes touching firmware or tools sources (build.yml, buildtools.yml)
# - v* tags: release (release.yml)
# - d* tags: snapshot prerelease (tagged_build.yml)
# - manual web trigger, or FORCE_RUN=true (workflow_dispatch / force_run)
# Pushes to master run nothing, same as GitHub where every job there is tag gated.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - src/**/*
        - lib/**/*
        - CMakeLists.txt
        - examples/config-tool/**/*
        - examples/send_sid/**/*
        - .gitlab/.gitlab-ci.yml
      variables:
        PIPELINE_TYPE: "dev"
    # Version tags (v0.0.0, v1.0.0-BETA, etc.)
    - if: $CI_COMMIT_TAG =~ /^v[0-9][0-9A-Za-z.-]*$/
      variables:
        PIPELINE_TYPE: "release"
    # Date tags (d20250101, etc.)
    - if: $CI_COMMIT_TAG =~ /^d[0-9a-z]+$/
      variables:
        PIPELINE_TYPE: "snapshot"
    - if: $CI_PIPELINE_SOURCE == "web" || $FORCE_RUN == "true"
      variables:
        PIPELINE_TYPE: "manual"

stages:
  - prepare
  - build
  - package
  - release

default:
  interruptible: true

# ============================================================================
# RULE SETS
# ============================================================================

.rules_firmware_dev:
  rules:
    - if: $PIPELINE_TYPE == "manual"
    - if: $PIPELINE_TYPE == "dev"
      changes:
        - src/**/*
        - lib/**/*
        - CMakeLists.txt
        - .gitlab/.gitlab-ci.yml

.rules_tools_dev:
  rules:
    - if: $PIPELINE_TYPE == "manual"
    - if: $PIPELINE_TYPE == "dev"
      changes:
        - examples/config-tool/**/*
        - examples/send_sid/**/*
        - .gitlab/.gitlab-ci.yml

# macOS runners only exist on gitlab.com
.rules_tools_dev_macos:
  rules:
    - if: $PIPELINE_TYPE == "manual" && $CI_SERVER_HOST != $PRIVATE_HOST
    - if: $PIPELINE_TYPE == "dev" && $CI_SERVER_HOST != $PRIVATE_HOST
      changes:
        - examples/config-tool/**/*
        - examples/send_sid/**/*
        - .gitlab/.gitlab-ci.yml

.rules_tagged:
  rules:
    - if: $PIPELINE_TYPE == "release" || $PIPELINE_TYPE == "snapshot"

.rules_tagged_macos:
  rules:
    - if: ($PIPELINE_TYPE == "release" || $PIPELINE_TYPE == "snapshot") && $CI_SERVER_HOST != $PRIVATE_HOST

# ============================================================================
# CACHING - shared SDK/toolchain caches
# ============================================================================

.pico_sdk_cache:
  cache:
    - key: arm-gnu-toolchain-13.2
      paths:
        - arm-gnu-toolchain/
      policy: pull-push
    - key: pico-sdk-${PICO_SDK_REF}
      paths:
        - pico-sdk/
      policy: pull-push
    - key: pico-extras-${PICO_EXTRAS_REF}
      paths:
        - pico-extras/
      policy: pull-push
    - key: picotool-${PICOTOOL_REF}
      paths:
        - picotool/
      policy: pull-push

# ============================================================================
# FIRMWARE BUILD TEMPLATE (build.yml / release.yml / tagged_build.yml matrix)
# One job per variant, like the GitHub matrix. The DIRECTORY values are also
# used by the package jobs below to pick the right artifacts.
# ============================================================================

.firmware_build:
  stage: build
  image: ubuntu:22.04
  extends: .pico_sdk_cache
  parallel:
    matrix: &firmware_matrix
      - DIRECTORY: [pico]
        BOARD: [pico]
        PLATFORM: [rp2040]
        WITHEMULATOR: ["0"]
        ENABLE_NET: ["0"]
      - DIRECTORY: [pico_em]
        BOARD: [pico]
        PLATFORM: [rp2040]
        WITHEMULATOR: ["1"]
        ENABLE_NET: ["0"]
      - DIRECTORY: [picow]
        BOARD: [pico_w]
        PLATFORM: [rp2040]
        WITHEMULATOR: ["0"]
        ENABLE_NET: ["0"]
      - DIRECTORY: [picow_em]
        BOARD: [pico_w]
        PLATFORM: [rp2040]
        WITHEMULATOR: ["1"]
        ENABLE_NET: ["0"]
      - DIRECTORY: [picow_net]
        BOARD: [pico_w]
        PLATFORM: [rp2040]
        WITHEMULATOR: ["0"]
        ENABLE_NET: ["1"]
      - DIRECTORY: [pico2]
        BOARD: [pico2]
        PLATFORM: [rp2350-arm-s]
        WITHEMULATOR: ["0"]
        ENABLE_NET: ["0"]
      - DIRECTORY: [pico2_em]
        BOARD: [pico2]
        PLATFORM: [rp2350-arm-s]
        WITHEMULATOR: ["1"]
        ENABLE_NET: ["0"]
      - DIRECTORY: [pico2w]
        BOARD: [pico2_w]
        PLATFORM: [rp2350-arm-s]
        WITHEMULATOR: ["0"]
        ENABLE_NET: ["0"]
      - DIRECTORY: [pico2w_emnet]
        BOARD: [pico2_w]
        PLATFORM: [rp2350-arm-s]
        WITHEMULATOR: ["1"]
        ENABLE_NET: ["1"]
  before_script:
    # libusb and pkg-config are needed to build picotool
    - apt-get update
    - apt-get install -y build-essential cmake git python3 wget curl xz-utils zip pkg-config libusb-1.0-0-dev
    # SID player dependencies (xa65, bin2h), emulator variants only
    - |
      if [ "$WITHEMULATOR" = "1" ]; then
        apt-get install -y xa65
        rm -rf /tmp/bin2h
        git clone --depth 1 "$BIN2H_REPO" /tmp/bin2h
        make -C /tmp/bin2h
        cp /tmp/bin2h/bin2h /usr/local/bin/
        bin2h --help
      fi
    # ARM toolchain 13.2 Rel1, the version carlosperate/arm-none-eabi-gcc-action installs
    - |
      ARM_GCC_DIR="${CI_PROJECT_DIR}/arm-gnu-toolchain"
      if [ ! -x "${ARM_GCC_DIR}/bin/arm-none-eabi-gcc" ]; then
        wget -q "https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz" -O /tmp/arm-gcc.tar.xz
        mkdir -p "${ARM_GCC_DIR}"
        tar xf /tmp/arm-gcc.tar.xz -C "${ARM_GCC_DIR}" --strip-components=1
        rm /tmp/arm-gcc.tar.xz
      fi
    - export PATH="${CI_PROJECT_DIR}/arm-gnu-toolchain/bin:${PATH}"
    - arm-none-eabi-gcc --version
    # Pico SDK, plus the tinyusb dependencies for this platform
    - |
      if [ ! -d "pico-sdk" ]; then
        git clone --depth 1 --branch "${PICO_SDK_REF}" --recurse-submodules https://github.com/raspberrypi/pico-sdk.git pico-sdk
      fi
    - export PICO_SDK_PATH="${CI_PROJECT_DIR}/pico-sdk"
    - (cd pico-sdk/lib/tinyusb && python3 tools/get_deps.py "${PLATFORM}")
    # Pico Extras
    - |
      if [ ! -d "pico-extras" ]; then
        git clone --depth 1 --branch "${PICO_EXTRAS_REF}" --recurse-submodules https://github.com/raspberrypi/pico-extras.git pico-extras
      fi
    - export PICO_EXTRAS_PATH="${CI_PROJECT_DIR}/pico-extras"
    # picotool
    - |
      if [ ! -d "picotool" ]; then
        git clone --depth 1 --branch "${PICOTOOL_REF}" --recurse-submodules https://github.com/raspberrypi/picotool.git picotool-src
        cmake -S picotool-src -B picotool-src/build -DCMAKE_INSTALL_PREFIX="${CI_PROJECT_DIR}/picotool" -DPICOTOOL_FLAT_INSTALL=1
        cmake --build picotool-src/build -j "${BUILD_THREADS}" --target install
        rm -rf picotool-src
      fi
  script:
    # The SID player is checked out into lib/ for emulator variants only
    - |
      EMUDIR=""
      if [ "$WITHEMULATOR" = "1" ]; then
        rm -rf lib/usbsid-player
        git clone --depth 1 "$USBSID_PLAYER_REPO" lib/usbsid-player
        EMUDIR="${CI_PROJECT_DIR}/lib/usbsid-player"
      fi
      unset PICO_PLATFORM PICO_BOARD
      cmake -S . -B "build_${DIRECTORY}" \
        -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
        -DPICO_PLATFORM="${PLATFORM}" \
        -DPICO_BOARD="${BOARD}" \
        -Dpicotool_DIR="${CI_PROJECT_DIR}/picotool/picotool" \
        -DONBOARD_EMULATOR="${WITHEMULATOR}" \
        -DEMUDIR="${EMUDIR}" \
        -DENABLE_NET="${ENABLE_NET}"
    - cmake --build "build_${DIRECTORY}" --config "${BUILD_TYPE}" -j "${BUILD_THREADS}"
    - ls -la "build_${DIRECTORY}"/*.uf2
    # dist/usbsid<directory>/ is the layout the snapshot zips expect
    - mkdir -p "dist/usbsid${DIRECTORY}"
    - cp -av "build_${DIRECTORY}"/*.uf2 "dist/usbsid${DIRECTORY}/"
  artifacts:
    paths:
      - dist/

# Dev build (build.yml)
firmware:
  extends:
    - .firmware_build
    - .rules_firmware_dev
  artifacts:
    name: "usbsid${DIRECTORY}-${CI_COMMIT_REF_SLUG}-autobuild-${CI_PIPELINE_IID}"
    expire_in: 1 week

# Release and snapshot build (release.yml, tagged_build.yml)
release:firmware:
  extends:
    - .firmware_build
    - .rules_tagged
  artifacts:
    name: "releasebuild-usbsid${DIRECTORY}"
    expire_in: 4 weeks

# ============================================================================
# TOOLS BUILD TEMPLATES (buildtools.yml)
# send_sid links the USBSID-Player, so it is checked out into lib/ and
# passed as EMUDIR (relative to examples/send_sid, like GitHub).
# ============================================================================

.tools_player_clone:
  script:
    - |
      EMUDIR=""
      if [ "$DIRECTORY" = "send_sid" ]; then
        rm -rf lib/usbsid-player
        git clone --depth 1 "$USBSID_PLAYER_REPO" lib/usbsid-player
        EMUDIR="../../lib/usbsid-player"
      fi
      export EMUDIR

.tools_ubuntu:
  stage: build
  image: ubuntu:latest
  parallel:
    matrix: &tools_matrix
      - DIRECTORY: [config-tool]
        BUILDNAME: [cfg_usbsid]
      - DIRECTORY: [send_sid]
        BUILDNAME: [send_sid]
  before_script:
    - apt-get update
    - apt-get install -y pkg-config cmake build-essential libusb-1.0-0 libusb-1.0-0-dev git
    - !reference [.tools_player_clone, script]
  script:
    - cd "examples/${DIRECTORY}"
    - ls -lhai
    - rm -f "${BUILDNAME}"
    - cmake -S . -B build -DEXECUTABLE="${BUILDNAME}" -DEMUDIR="${EMUDIR}"
    - cmake --build build -j "$(nproc)"
    - ls -lhai
  artifacts:
    name: "tools-${BUILDNAME}-linux"
    paths:
      - examples/${DIRECTORY}/${BUILDNAME}

# Windows runner (gitlab.com SaaS by default), MinGW64 through msys2 like the GitHub job
.tools_windows:
  stage: build
  tags:
    - $WINDOWS_RUNNER_TAG
  parallel:
    matrix: *tools_matrix
  before_script:
    - choco install msys2 -y --no-progress
    - C:\tools\msys64\usr\bin\bash -lc "pacman -Syu --noconfirm"
    - C:\tools\msys64\usr\bin\bash -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-libusb mingw-w64-x86_64-cmake mingw-w64-x86_64-pkg-config mingw-w64-x86_64-ninja"
  script:
    # The runner shell is PowerShell: variables are $env:NAME there, and only
    # the environment (not PowerShell variables) reaches the msys2 shell.
    # CHERE_INVOKING keeps the msys2 login shell in the current directory.
    - |
      $env:EMUDIR = ""
      if ($env:DIRECTORY -eq "send_sid") {
        if (Test-Path lib/usbsid-player) { Remove-Item -Recurse -Force lib/usbsid-player }
        git clone -q --depth 1 $env:USBSID_PLAYER_REPO lib/usbsid-player
        $env:EMUDIR = "../../lib/usbsid-player"
      }
      $env:MSYSTEM = "MINGW64"
      $env:CHERE_INVOKING = "1"
      Set-Location "examples/$env:DIRECTORY"
      C:\tools\msys64\usr\bin\bash -lc 'rm -f $BUILDNAME.exe; cmake -S . -B build -DEXECUTABLE=$BUILDNAME -DEMUDIR=$EMUDIR && cmake --build build -j$(nproc)'
  artifacts:
    name: "tools-${BUILDNAME}-windows"
    paths:
      - examples/${DIRECTORY}/${BUILDNAME}.exe
      - examples/${DIRECTORY}/*.dll

# gitlab.com SaaS macOS 14 (Apple Silicon) runner
.tools_macos14:
  stage: build
  tags:
    - saas-macos-medium-m1
  image: macos-14-xcode-15
  parallel:
    matrix: &tools_macos_matrix
      - DIRECTORY: [config-tool]
        BUILDNAME: [cfg_usbsid_macos14]
      - DIRECTORY: [send_sid]
        BUILDNAME: [send_sid_macos14]
  before_script:
    - brew update
    - brew install pkg-config cmake ninja libusb
    - !reference [.tools_player_clone, script]
  script:
    - cd "examples/${DIRECTORY}"
    - ls -lhai
    - rm -f "${BUILDNAME}"
    - cmake -S . -B build -DEXECUTABLE="${BUILDNAME}" -DEMUDIR="${EMUDIR}"
    - cmake --build build -j "$(sysctl -n hw.ncpu)"
    - ls -lhai
  artifacts:
    name: "tools-${BUILDNAME}-macos14"
    paths:
      - examples/${DIRECTORY}/${BUILDNAME}

# macOS 15 Intel: enabled on GitHub (macos-15-intel), disabled here because
# gitlab.com SaaS has no Intel macOS runner. Add a .tools_macos15_intel
# template with a custom runner tag (BUILDNAME cfg_usbsid_macos15intel and
# send_sid_macos15intel) and matching tools:macos15-intel jobs when one exists.

# ============================================================================
# DEV TOOLS BUILDS (buildtools.yml on push)
# ============================================================================

tools:ubuntu:
  extends:
    - .tools_ubuntu
    - .rules_tools_dev
  artifacts:
    expire_in: 1 week

tools:windows:
  extends:
    - .tools_windows
    - .rules_tools_dev
  artifacts:
    expire_in: 1 week

tools:macos14:
  extends:
    - .tools_macos14
    - .rules_tools_dev_macos
  artifacts:
    expire_in: 1 week

# ============================================================================
# RELEASE TOOLS BUILDS (buildtools.yml called from release.yml and tagged_build.yml)
# ============================================================================

release:tools:ubuntu:
  extends:
    - .tools_ubuntu
    - .rules_tagged
  artifacts:
    expire_in: 4 weeks

release:tools:windows:
  extends:
    - .tools_windows
    - .rules_tagged
  artifacts:
    expire_in: 4 weeks

release:tools:macos14:
  extends:
    - .tools_macos14
    - .rules_tagged_macos
  artifacts:
    expire_in: 4 weeks

# ============================================================================
# CLEANUP (tagged_build.yml cleanup_previous_builds)
# Delete snapshot prereleases older than 30 days, but keep the newest 10.
# Needs a GitLab API token in the GITLAB_API_TOKEN CI/CD variable, skipped
# without one. Only releases are deleted, the d* tags stay.
# ============================================================================

cleanup:old-snapshots:
  stage: prepare
  image: alpine:latest
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      if [ -z "${GITLAB_API_TOKEN:-}" ]; then
        echo "GITLAB_API_TOKEN not set, skipping cleanup"
        exit 0
      fi
      API_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
      releases=$(curl -fsS --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" "${API_URL}?per_page=100")
      # Newest first, skip the first 10, then keep everything younger than 30 days
      echo "$releases" | jq -r --argjson now "$(date +%s)" '
        [ .[] | select(.tag_name | test("^d[0-9a-z]+$")) ]
        | sort_by(.created_at) | reverse
        | to_entries[] | select(.key >= 10)
        | select(($now - (.value.created_at | sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z") | fromdateiso8601)) > 30 * 86400)
        | .value.tag_name' | while read -r tag; do
        echo "Deleting old snapshot prerelease: ${tag}"
        curl -fsS --request DELETE --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" "${API_URL}/${tag}" > /dev/null
      done
      echo "Cleanup complete"
  rules:
    - if: $PIPELINE_TYPE == "snapshot"
  allow_failure: true

# ============================================================================
# PACKAGE STAGE
# ============================================================================

# release.yml: "Zip firmware by PCB revision" (v* tags)
package:firmware:release:
  stage: package
  image: alpine:latest
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache zip
  script:
    - mkdir -p release
    - cp -v dist/*/*.uf2 release/
    - cd release
    - |
      for ver in v1.0 v1.3 v1.5; do
        set -- ./*"${ver}"*.uf2
        if [ -e "$1" ]; then
          zip "USBSID-Pico_${ver}.zip" "$@"
          rm -- "$@"
        fi
      done
    - ls -la
  artifacts:
    name: "releasebuild-usbsid-firmware"
    paths:
      - release/*.zip
    expire_in: never
  needs:
    - job: release:firmware
      parallel:
        matrix: *firmware_matrix
  rules:
    - if: $PIPELINE_TYPE == "release"

# tagged_build.yml: one zip per firmware variant (d* tags)
package:firmware:snapshot:
  stage: package
  image: alpine:latest
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache zip
  script:
    - cd dist
    - |
      for d in usbsid*/; do
        d="${d%/}"
        zip -r "${d}-taggedbuild-${CI_COMMIT_TAG}.zip" "${d}/"
      done
    - ls -la
  artifacts:
    name: "taggedbuild-usbsid-firmware"
    paths:
      - dist/*.zip
    expire_in: never
  needs:
    - job: release:firmware
      parallel:
        matrix: *firmware_matrix
  rules:
    - if: $PIPELINE_TYPE == "snapshot"

# release.yml / tagged_build.yml: "Zip tools", flat at the zip root.
# The macOS job only exists on gitlab.com, hence optional.
package:tools:
  stage: package
  image: alpine:latest
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache zip
  script:
    - mkdir -p tools-output
    - cp -v examples/config-tool/cfg_usbsid* tools-output/ || true
    - cp -v examples/send_sid/send_sid* tools-output/ || true
    - cp -v examples/config-tool/*.dll tools-output/ || true
    - cp -v examples/send_sid/*.dll tools-output/ || true
    - ls -la tools-output/
    - zip -r -j tools.zip tools-output/
  artifacts:
    name: "releasebuild-usbsidtools"
    paths:
      - tools.zip
    expire_in: never
  needs:
    - job: release:tools:ubuntu
      parallel:
        matrix: *tools_matrix
    - job: release:tools:windows
      parallel:
        matrix: *tools_matrix
    - job: release:tools:macos14
      optional: true
      parallel:
        matrix: *tools_macos_matrix
  rules:
    - if: $PIPELINE_TYPE == "release" || $PIPELINE_TYPE == "snapshot"

# release.yml "Generate release notes": commits since the previous v* tag
release:notes:
  stage: package
  image: alpine:latest
  variables:
    GIT_DEPTH: "0"
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "${CI_PROJECT_DIR}"
  script:
    - |
      echo "**Commits in this release:**" > release_notes.md
      # The v* tag before this one, or the whole history the first time round
      PREV=$(git tag --list 'v*' --sort=-version:refname | grep -v "^${CI_COMMIT_TAG}\$" | head -n 1 || true)
      if [ -n "$PREV" ]; then
        git log "${PREV}..HEAD" --oneline >> release_notes.md
      else
        git log --oneline >> release_notes.md
      fi
      cat release_notes.md
  artifacts:
    paths:
      - release_notes.md
    expire_in: 4 weeks
  rules:
    - if: $PIPELINE_TYPE == "release"

# ============================================================================
# RELEASE STAGE
# The package jobs keep their artifacts forever, the release links to them.
# ============================================================================

# release.yml "Create tagged release" (v* tags)
create:release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release for ${CI_COMMIT_TAG}"
  release:
    tag_name: ${CI_COMMIT_TAG}
    name: "${CI_COMMIT_TAG}"
    description: release_notes.md
    assets:
      links:
        - name: "Firmware zips, browse (per PCB revision)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/browse/release?job=package:firmware:release"
          link_type: "package"
        - name: "Firmware zips, download all"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=package:firmware:release"
          link_type: "package"
        - name: "Tools (tools.zip), download"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/tools.zip?job=package:tools"
          link_type: "package"
  needs:
    - job: package:firmware:release
    - job: package:tools
    - job: release:notes
  rules:
    - if: $PIPELINE_TYPE == "release"

# tagged_build.yml "Create Draft Release" + "Publish Release" (d* tags)
create:snapshot:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating snapshot prerelease for ${CI_COMMIT_TAG}"
  release:
    tag_name: ${CI_COMMIT_TAG}
    name: "${CI_COMMIT_TAG} snapshot"
    description: |
      ## Snapshot build ${CI_COMMIT_TAG}

      Automated snapshot build for testing purposes.
      This is a prerelease and may contain bugs.
    assets:
      links:
        - name: "Firmware zips (one per variant), browse"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/browse/dist?job=package:firmware:snapshot"
          link_type: "package"
        - name: "Firmware zips (one per variant), download all"
